name: Build RajMistri BD APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Find RajMistri zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*rajmistri*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No file matching *rajmistri*.zip found at repo root. Files present:"
            find . -maxdepth 1 -iname "*.zip"
            exit 1
          fi
          echo "Using zip: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Unzip project
        run: |
          rm -rf project
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

      - name: Locate Gradle project root
        run: |
          SETTINGS_PATH=$(find project -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_PATH" ]; then
            echo "Could not find settings.gradle.kts inside the zip. Extracted structure:"
            find project -maxdepth 4
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_PATH")
          echo "Gradle project root: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create .env (placeholder, not used at build time)
        working-directory: ${{ env.PROJECT_DIR }}
        run: echo "GEMINI_API_KEY=dummy" > .env

      - name: Generate debug keystore
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RajMistriBD-app-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
